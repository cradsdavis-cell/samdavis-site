<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment received - Crads-AI</title>
<style>
  :root{--paper:#F7F5EF;--card:#FFF;--line:#E3E1D6;--ink:#1F2D24;--soft:#5C6B60;--accent:#A4582C;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--paper:#161A16;--card:#1D231E;--line:#2E362F;--ink:#E9ECE6;--soft:#9AA69B;--accent:#D08A52;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh;padding:32px 24px}
  .wrap{width:100%;max-width:520px;margin:auto}
  h1{font-size:20px;font-weight:650;margin:0 0 6px}
  p{color:var(--soft);margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:11px 18px;border-radius:10px;font-weight:500}
  .tick{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;margin:0 0 12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="tick" aria-hidden="true">&check;</div>
    <h1>Payment received</h1>
    <!-- Where Stripe sends a buyer after a completed checkout (2026-08-25).
         It used to send them to /open, whose job is to open a mineral that
         ALREADY exists, so a buyer landed on "this link is missing which box to
         open" seconds after paying. Nothing was wrong; the build was already
         running. The page just had no way to say so. -->
    <p>Your mineral is building now. It usually takes a few minutes.</p>
    <p>You can close this tab. The Crads-AI app is already showing the progress, and it finishes on its own with nothing more from you.</p>
    <p><a class="btn" href="crads-ai://">Back to the Crads-AI app</a></p>
  </div>
</div>
</body>
</html>
