<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open your box - Crads-AI</title>
<style>
  :root{--paper:#F7F5EF;--card:#FFF;--line:#E3E1D6;--ink:#1F2D24;--soft:#5C6B60;--accent:#A4582C;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--paper:#161A16;--card:#1D231E;--line:#2E362F;--ink:#E9ECE6;--soft:#9AA69B;--accent:#D08A52;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh;padding:32px 24px}
  .wrap{width:100%;max-width:520px;margin:auto}
  h1{font-size:20px;font-weight:650;margin:0 0 6px}
  p{color:var(--soft);margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:11px 18px;border-radius:10px;font-weight:500}
  a.alt{color:var(--accent);text-decoration:none;font-size:13.5px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;color:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Opening your box&hellip;</h1>
    <p id="msg">If the Crads-AI app is installed, it should be opening now.</p>
    <p id="dl" style="display:none">
      <a class="btn" href="https://github.com/cradsdavis-cell/crads-ai-app/releases/latest">Download the app</a><br><br>
      <span class="mono" id="which"></span>
    </p>
    <p><a class="alt" id="again" href="#">Try opening it again</a></p>
  </div>
</div>
<script>
  var slug = (location.hash.match(/^#box=([a-z0-9-]+)$/) || [])[1] || '';
  var deep = slug ? 'crads-ai://box/' + slug : '';
  function go(){ if (deep) location.href = deep; }
  document.getElementById('again').onclick = function(e){ e.preventDefault(); go(); };
  if (!slug) {
    document.getElementById('msg').textContent = 'This link is missing which box to open. Use the link from your email, or open the Crads-AI app directly.';
  } else {
    document.getElementById('which').textContent = slug;
    go();
    setTimeout(function(){
      document.getElementById('msg').textContent = 'Nothing opened, so the app probably is not installed on this computer yet.';
      document.getElementById('dl').style.display = '';
    }, 2200);
  }
</script>
</body>
</html>
